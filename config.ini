[site]
name     = Ian
; Brand shown in the nav bar — can differ from name
brand    = Ian
; Default locale for the site. Supported: en, zh
locale   = en
subtitle = GNU&Linux | Open Source | Pentest
; Public URL (used in RSS/JSONFeed links)
url      = https://ode.up.railway.app
; Keep description on one line
description = A scaffold for long articles, short notes, and dev logs. Next.js App Router, deployed straight to Railway. Getting the structure and tone right first — warm paper palette, narrow columns, Iosevka + Schibsted type, content before decoration.

[recent]
; Number of posts shown on homepage
limit = 7

[featured]
; Show the "Notable Publications" block (true/false)
enabled = true

[notebook]
; Comma-separated tags shown on homepage
tags = Longform, Fragments, Dev Log, Reading Notes, Infrastructure, Design System

[projects]
; Highlighted Projects — format: Name | URL | Description
; Add as many numbered entries as you like
1 = Ode | https://github.com/itworksig/Ode | The scaffold behind this blog — Next.js, Railway, warm editorial design

[links]
; Quick Links — format: Label | URL
1 = GitHub   | https://github.com/itworksig
2 = RSS Feed | /rss.xml

[disqus]
; Disqus shortname — leave empty to disable comments
; Only appears on post pages, never on listing/category/tag pages
shortname =

[sponsor]
; Show a Sponsor button on post pages (true/false)
enabled = false
label   = Sponsor
url     = https://github.com/sponsors/username

[support]
; Show a "Support My Work" box on the homepage (true/false)
enabled     = false
title       = Support My Work
description = Help me keep creating technical content and open source software.
; Links: Label | URL
1 = GitHub Sponsors | https://github.com/sponsors/username
2 = Patreon         | https://patreon.com/username

[footer]
; GitHub repo for the "source code available here" line
github = https://github.com/itworksig/Ode
