1 = Student by day, breaking things by night. I spend most of my time on penetration testing and Linux — not always in that order.
2 = The blog is mostly a personal notebook. When I figure something out, hit a weird edge case, or build a small tool that actually works, I write it down here. Topics drift between pentesting techniques, Linux administration, DevOps workflows, and open source tooling — whatever I'm deep into at the moment.
3 = Nothing here is polished documentation. It's closer to field notes — written fast, revised when I'm wrong, and hopefully useful to someone who's stuck on the same thing I was.

