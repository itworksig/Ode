<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Attention mechanism concept diagram</title>
  <desc id="desc">A stylized diagram showing tokens flowing into query, key, and value blocks, then into attention scores and output context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4f1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="38" fill="url(#bg)"/>
  <g opacity="0.35">
    <circle cx="1000" cy="142" r="120" fill="#bfdbfe"/>
    <circle cx="214" cy="600" r="150" fill="#ccfbf1"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="105" y="95" width="990" height="530" rx="32" fill="#ffffff"/>
  </g>
  <text x="600" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Attention turns many signals into one useful context</text>
  <text x="600" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4b5563">Query asks, keys compare, values carry the information forward.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="135" y="290" width="150" height="70" rx="18" fill="#dbeafe"/>
    <text x="210" y="333" text-anchor="middle" fill="#1d4ed8">Token A</text>
    <rect x="135" y="405" width="150" height="70" rx="18" fill="#dbeafe"/>
    <text x="210" y="448" text-anchor="middle" fill="#1d4ed8">Token B</text>
    <rect x="135" y="520" width="150" height="70" rx="18" fill="#dbeafe"/>
    <text x="210" y="563" text-anchor="middle" fill="#1d4ed8">Token C</text>
  </g>
  <g stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M285 325 C345 325 355 280 415 280"/>
    <path d="M285 440 C345 440 355 395 415 395"/>
    <path d="M285 555 C345 555 355 510 415 510"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="415" y="246" width="170" height="68" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="500" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">Query</text>
    <rect x="415" y="361" width="170" height="68" rx="18" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/>
    <text x="500" y="403" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">Key</text>
    <rect x="415" y="476" width="170" height="68" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="500" y="518" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">Value</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M585 280 C650 280 650 355 705 355"/>
    <path d="M585 395 C650 395 650 355 705 355"/>
    <path d="M585 510 C650 510 650 430 705 430"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="705" y="300" width="180" height="96" rx="24" fill="url(#accent)"/>
    <text x="795" y="342" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">Scores</text>
    <text x="795" y="372" text-anchor="middle" font-size="15" fill="#e0f2fe">softmax(QK^T)</text>
    <rect x="705" y="425" width="180" height="96" rx="24" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="795" y="468" text-anchor="middle" font-size="22" font-weight="800" fill="#0e7490">Weighted V</text>
    <text x="795" y="497" text-anchor="middle" font-size="15" fill="#155e75">context vector</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M885 348 C925 348 930 415 970 415"/>
    <path d="M885 473 C925 473 930 415 970 415"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="970" y="362" width="130" height="106" rx="24" fill="#111827"/>
    <text x="1035" y="407" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">Output</text>
    <text x="1035" y="438" text-anchor="middle" font-size="15" fill="#cbd5e1">next layer</text>
  </g>
</svg>
