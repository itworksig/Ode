<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Hexagon outline -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9"
    fill="none" stroke="#9e0146" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Inner graph lines (every other vertex to center) -->
  <line x1="16" y1="2"  x2="16" y2="16" stroke="#9e0146" stroke-width="1.1" stroke-opacity="0.65"/>
  <line x1="28" y1="23" x2="16" y2="16" stroke="#9e0146" stroke-width="1.1" stroke-opacity="0.65"/>
  <line x1="4"  y1="23" x2="16" y2="16" stroke="#9e0146" stroke-width="1.1" stroke-opacity="0.65"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="3" fill="#9e0146"/>
  <!-- Vertex dots -->
  <circle cx="16" cy="2"  r="1.8" fill="#9e0146" fill-opacity="0.7"/>
  <circle cx="28" cy="23" r="1.8" fill="#9e0146" fill-opacity="0.7"/>
  <circle cx="4"  cy="23" r="1.8" fill="#9e0146" fill-opacity="0.7"/>
</svg>
