<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">tensor.h learning map</title>
  <desc id="desc">A step-by-step diagram showing how Arr values become Tensor nodes, flow through operations, compute loss, run backward, and update weights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1400" height="820" rx="40" fill="url(#bg)"/>
  <circle cx="1200" cy="160" r="150" fill="#dbeafe" opacity="0.85"/>
  <circle cx="190" cy="690" r="190" fill="#dcfce7" opacity="0.85"/>
  <g filter="url(#shadow)">
    <rect x="95" y="105" width="1210" height="610" rx="34" fill="#ffffff"/>
  </g>
  <text x="700" y="168" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#111827">Learning Neural Networks From tensor.h</text>
  <text x="700" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#475569">A tiny C library turns arrays into tensors, operations into a graph, and gradients into learning.</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(150 305)">
      <rect width="190" height="160" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="95" y="54" text-anchor="middle" font-size="23" font-weight="800" fill="#111827">Arr</text>
      <text x="95" y="88" text-anchor="middle" font-size="16" fill="#475569">values</text>
      <text x="95" y="114" text-anchor="middle" font-size="16" fill="#475569">shape</text>
      <text x="95" y="140" text-anchor="middle" font-size="16" fill="#475569">strides</text>
    </g>
    <g transform="translate(405 305)">
      <rect width="190" height="160" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="95" y="54" text-anchor="middle" font-size="23" font-weight="800" fill="#111827">Tensor</text>
      <text x="95" y="88" text-anchor="middle" font-size="16" fill="#475569">data + grad</text>
      <text x="95" y="114" text-anchor="middle" font-size="16" fill="#475569">op code</text>
      <text x="95" y="140" text-anchor="middle" font-size="16" fill="#475569">prev nodes</text>
    </g>
    <g transform="translate(660 305)">
      <rect width="190" height="160" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="95" y="52" text-anchor="middle" font-size="23" font-weight="800" fill="#111827">Forward</text>
      <text x="95" y="88" text-anchor="middle" font-size="16" fill="#475569">matmul</text>
      <text x="95" y="114" text-anchor="middle" font-size="16" fill="#475569">relu</text>
      <text x="95" y="140" text-anchor="middle" font-size="16" fill="#475569">logsoftmax</text>
    </g>
    <g transform="translate(915 305)">
      <rect width="190" height="160" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="95" y="54" text-anchor="middle" font-size="23" font-weight="800" fill="#111827">Loss</text>
      <text x="95" y="92" text-anchor="middle" font-size="16" fill="#475569">mean</text>
      <text x="95" y="122" text-anchor="middle" font-size="16" fill="#475569">seed grad = 1</text>
    </g>
    <g transform="translate(1170 305)">
      <rect width="190" height="160" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="95" y="54" text-anchor="middle" font-size="23" font-weight="800" fill="#111827">Backward</text>
      <text x="95" y="90" text-anchor="middle" font-size="16" fill="#475569">walk prevs</text>
      <text x="95" y="120" text-anchor="middle" font-size="16" fill="#475569">fill grads</text>
    </g>
  </g>
  <g stroke="url(#accent)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 385 H392"/>
    <path d="M378 363 L400 385 L378 407"/>
    <path d="M605 385 H647"/>
    <path d="M633 363 L655 385 L633 407"/>
    <path d="M860 385 H902"/>
    <path d="M888 363 L910 385 L888 407"/>
    <path d="M1115 385 H1157"/>
    <path d="M1143 363 L1165 385 L1143 407"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="510" y="555" width="380" height="70" rx="20" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="700" y="598" font-size="21" font-weight="800" fill="#0e7490">Update weights: w -= grad * learning_rate</text>
    <path d="M1175 465 C1030 555 920 590 890 590" stroke="#0f766e" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
