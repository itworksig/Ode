<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Quarkdown writing workflow</title>
  <desc id="desc">A visual overview of writing Quarkdown source, compiling it, and exporting polished HTML and PDF documents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef7f3"/>
    </linearGradient>
    <linearGradient id="bluegreen" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1400" height="820" rx="42" fill="url(#bg)"/>
  <circle cx="1165" cy="170" r="150" fill="#dbeafe" opacity="0.9"/>
  <circle cx="175" cy="695" r="195" fill="#ccfbf1" opacity="0.9"/>
  <g filter="url(#shadow)">
    <rect x="105" y="110" width="1190" height="600" rx="34" fill="#ffffff"/>
  </g>
  <text x="700" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#111827">Quarkdown: Markdown With Real Document Power</text>
  <text x="700" y="225" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#475569">Write readable source files, then compile polished HTML, PDF, slides, or documentation.</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(160 300)">
      <rect width="285" height="250" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="32" y="34" width="170" height="18" rx="9" fill="#2563eb"/>
      <rect x="32" y="76" width="220" height="14" rx="7" fill="#334155"/>
      <rect x="32" y="108" width="190" height="12" rx="6" fill="#94a3b8"/>
      <rect x="32" y="136" width="220" height="12" rx="6" fill="#94a3b8"/>
      <rect x="32" y="179" width="104" height="42" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <text x="142" y="285" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">1. Write</text>
      <text x="142" y="315" text-anchor="middle" font-size="16" fill="#64748b">main.qd, images, code</text>
    </g>
    <g transform="translate(555 300)">
      <rect width="285" height="250" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="38" y="44" width="210" height="160" rx="18" fill="#0f172a"/>
      <text x="64" y="88" font-size="18" fill="#93c5fd">$ quarkdown c</text>
      <text x="64" y="123" font-size="18" fill="#86efac">--preview --watch</text>
      <text x="64" y="158" font-size="18" fill="#fcd34d">--pdf</text>
      <text x="142" y="285" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">2. Compile</text>
      <text x="142" y="315" text-anchor="middle" font-size="16" fill="#64748b">preview, validate, export</text>
    </g>
    <g transform="translate(950 300)">
      <rect width="285" height="250" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="42" y="34" width="95" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="60" y="58" width="58" height="7" rx="4" fill="#2563eb"/>
      <rect x="60" y="84" width="55" height="5" rx="3" fill="#334155"/>
      <rect x="60" y="102" width="58" height="5" rx="3" fill="#94a3b8"/>
      <rect x="147" y="56" width="95" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="165" y="80" width="58" height="7" rx="4" fill="#0d9488"/>
      <rect x="165" y="106" width="55" height="5" rx="3" fill="#334155"/>
      <rect x="165" y="124" width="58" height="5" rx="3" fill="#94a3b8"/>
      <text x="142" y="285" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">3. Publish</text>
      <text x="142" y="315" text-anchor="middle" font-size="16" fill="#64748b">HTML, PDF, docs, slides</text>
    </g>
  </g>
  <g stroke="url(#bluegreen)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 420 H525"/>
    <path d="M510 395 L535 420 L510 445"/>
    <path d="M865 420 H920"/>
    <path d="M905 395 L930 420 L905 445"/>
  </g>
  <text x="700" y="665" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">The trick is not to memorize every function. Start with a real document, then add layout, references, fonts, and export controls as needed.</text>
</svg>
