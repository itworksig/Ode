name: Release

# Trigger: push to main that changes VERSION, or manual dispatch
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write   # create tags + releases
  packages: write   # push to GHCR

jobs:
  release:
    name: Tag · Release · Publish image
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout with full history so we can diff against previous tags ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Read the version string from VERSION ──────────────────────────
      - name: Read VERSION
        id: ver
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"

      # ── 3. Skip if this tag was already released ─────────────────────────
      - name: Check tag exists
        id: tag_check
        run: |
          if git ls-remote --tags origin \
               "refs/tags/${{ steps.ver.outputs.tag }}" | grep -q .; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Generate changelog from commits since last tag ─────────────────
      #
      #   Conventional commit prefixes recognised:
      #     feat / feat(scope)  → ## Features
      #     fix  / fix(scope)   → ## Bug Fixes
      #   Everything else       → omitted from release notes
      #
      #   Output format (matches screenshot style):
      #     - scope: message (a1b2c3d)
      #
      - name: Generate release notes
        if: steps.tag_check.outputs.exists == 'false'
        id: notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline --no-merges)
          else
            COMMITS=$(git log --oneline --no-merges)
          fi

          NOTES=$(mktemp)
          TODAY=$(date +%Y-%m-%d)
          printf "## %s (%s)\n\n" "${{ steps.ver.outputs.version }}" "$TODAY" >> "$NOTES"

          # ── collect lines by category ────────────────────────────────────
          FEAT_LINES=""
          FIX_LINES=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            HASH=$(echo "$line" | cut -d' ' -f1)
            MSG=$(echo  "$line" | cut -d' ' -f2-)

            if echo "$MSG" | grep -qiE "^feat(\([^)]*\))?:"; then
              CLEAN=$(echo "$MSG" | sed -E \
                's/^feat\(([^)]+)\): /\1: /i; s/^feat: //i')
              FEAT_LINES="${FEAT_LINES}- ${CLEAN} (${HASH})\n"

            elif echo "$MSG" | grep -qiE "^fix(\([^)]*\))?:"; then
              CLEAN=$(echo "$MSG" | sed -E \
                's/^fix\(([^)]+)\): /\1: /i; s/^fix: //i')
              FIX_LINES="${FIX_LINES}- ${CLEAN} (${HASH})\n"
            fi
          done <<< "$COMMITS"

          # ── write sections (Bug Fixes first, then Features) ─────────────
          if [ -n "$FIX_LINES" ]; then
            printf "## Bug Fixes\n\n"    >> "$NOTES"
            printf "%b" "$FIX_LINES"     >> "$NOTES"
            printf "\n"                  >> "$NOTES"
          fi

          if [ -n "$FEAT_LINES" ]; then
            printf "## Features\n\n"     >> "$NOTES"
            printf "%b" "$FEAT_LINES"    >> "$NOTES"
            printf "\n"                  >> "$NOTES"
          fi

          if [ -z "$FIX_LINES" ] && [ -z "$FEAT_LINES" ]; then
            printf "No user-facing changes.\n" >> "$NOTES"
          fi

          echo "notes_path=${NOTES}" >> "$GITHUB_OUTPUT"
          echo "--- Generated notes ---"
          cat "$NOTES"

      # ── 5. Create annotated git tag ──────────────────────────────────────
      - name: Create git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" \
                  -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      # ── 6. Publish GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  ${{ steps.ver.outputs.tag }}
          name:      ${{ steps.ver.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_path }}
          draft:     false
          prerelease: false

      # ── 7. Build Docker image (static site → nginx) and push to GHCR ─────
      - name: Set up Docker Buildx
        if: steps.tag_check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.tag_check.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action auto-generates tags:
      #   ghcr.io/owner/ode:1.0.0
      #   ghcr.io/owner/ode:1.0
      #   ghcr.io/owner/ode:latest
      - name: Docker metadata
        if: steps.tag_check.outputs.exists == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Ode
            org.opencontainers.image.description=A warm-toned multilingual static blog engine built on Next.js
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}

      - name: Build & push image
        if: steps.tag_check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          push:     true
          tags:     ${{ steps.meta.outputs.tags }}
          labels:   ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
