    <rect x="155" y="220" width="890" height="980" rx="28" fill="#ffffff"/>
  </g>
  <rect x="220" y="300" width="760" height="12" rx="6" fill="url(#ink)"/>
  <rect x="220" y="375" width="520" height="22" rx="11" fill="#111827"/>
  <rect x="220" y="430" width="660" height="18" rx="9" fill="#64748b"/>
  <rect x="220" y="470" width="590" height="18" rx="9" fill="#94a3b8"/>
  <g transform="translate(250 590)">
    <rect x="0" y="0" width="700" height="420" rx="24" fill="#f8fafc" stroke="#d1d5db" stroke-width="3"/>
    <rect x="48" y="60" width="230" height="68" rx="18" fill="#dbeafe"/>
    <rect x="48" y="162" width="604" height="22" rx="11" fill="#334155"/>
    <rect x="48" y="214" width="480" height="18" rx="9" fill="#94a3b8"/>
    <rect x="48" y="254" width="560" height="18" rx="9" fill="#94a3b8"/>
    <rect x="48" y="314" width="175" height="58" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/>
    <rect x="263" y="314" width="175" height="58" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <rect x="478" y="314" width="175" height="58" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/>
