  <text x="600" y="1290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" fill="#111827">Quarkdown</text>
  <text x="600" y="1360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#1f2937">完整功能写作手册</text>
  <text x="600" y="1424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#64748b">封面 · 页码 · 目录 · 图片 · 函数 · PDF</text>
